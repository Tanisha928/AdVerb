services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: adaptai
      RABBITMQ_DEFAULT_PASS: adaptai_secret
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI — queue depth visible here under Queues tab
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  postgres:
    # Use 16+ if your local volume was first created with PG16; else 15 is fine.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adaptai
      POSTGRES_USER: adaptai
      POSTGRES_PASSWORD: adaptai_secret
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host :5433 avoids conflict with a local Postgres on :5432; containers still use postgres:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptai -d adaptai"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      # Host 6380 if :6379 is already in use; containers still use redis:6379.
      - "6380:6379"

  brand-api:
    build: ./services/brand-api
    ports:
      # Host 8800 (change if in use on your machine).
      - "8800:8000"
    environment:
      DATABASE_URL: postgresql://adaptai:adaptai_secret@postgres:5432/adaptai
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AD_AI_SCENES: ${AD_AI_SCENES:-}
      AD_SCENE_IMAGE_SIZE: ${AD_SCENE_IMAGE_SIZE:-}
      AD_SCENE_IMAGE_MODEL: ${AD_SCENE_IMAGE_MODEL:-}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      HF_INFERENCE_ORIGIN: ${HF_INFERENCE_ORIGIN:-}
      AD_CREATIVE_MAX_WORKERS: ${AD_CREATIVE_MAX_WORKERS:-1}
      AD_CREATIVE_VARIANT_ATTEMPTS: ${AD_CREATIVE_VARIANT_ATTEMPTS:-1}
      AD_CREATIVE_VARIANT_COUNT: ${AD_CREATIVE_VARIANT_COUNT:-3}
      AD_PLAIN_BACKGROUND_ONLY: ${AD_PLAIN_BACKGROUND_ONLY:-true}
      POLLINATIONS_MAX_RETRIES: ${POLLINATIONS_MAX_RETRIES:-2}
      POLLINATIONS_RETRY_BASE_SECONDS: ${POLLINATIONS_RETRY_BASE_SECONDS:-0.8}
      POLLINATIONS_RETRY_JITTER_SECONDS: ${POLLINATIONS_RETRY_JITTER_SECONDS:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ad-serving:
    build: ./services/ad-serving
    ports:
      # Host 8801 (change if in use on your machine).
      - "8801:8001"
    environment:
      DATABASE_URL: postgresql://adaptai:adaptai_secret@postgres:5432/adaptai
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://adaptai:adaptai_secret@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  analytics-worker:
    build: ./services/analytics-worker
    environment:
      DATABASE_URL: postgresql://adaptai:adaptai_secret@postgres:5432/adaptai
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://adaptai:adaptai_secret@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: always

  brand-portal:
    build:
      context: ./apps/brand-portal
      args:
        NEXT_PUBLIC_BRAND_API_URL: http://localhost:8800
    ports:
      # Host 3000 is often taken; map 3010 → app :3000 (container still listens on 3000).
      - "3010:3000"
    environment:
      NEXT_PUBLIC_BRAND_API_URL: http://localhost:8800
      BRAND_API_URL: http://brand-api:8000

  user-feed:
    build:
      context: ./apps/user-feed
      args:
        NEXT_PUBLIC_AD_SERVING_URL: http://localhost:8801
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_AD_SERVING_URL: http://localhost:8801

  admin:
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_AD_SERVING_URL: http://localhost:8801
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_AD_SERVING_URL: http://localhost:8801
      AD_SERVING_INTERNAL_URL: http://ad-serving:8001

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - brand-api
      - ad-serving

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3004:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
