groups:
  - name: adverb-api-alerts
    rules:
      - alert: HighApiErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job=~"ad-serving|brand-api",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job=~"ad-serving|brand-api"}[5m]))
          ) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "API error rate is high"
          description: "5xx responses are above 5% for at least 10 minutes."

      - alert: HighApiLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job) (
              rate(http_request_duration_seconds_bucket{job=~"ad-serving|brand-api"}[5m])
            )
          ) > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency is high"
          description: "p95 latency is above 750ms for at least 10 minutes."
