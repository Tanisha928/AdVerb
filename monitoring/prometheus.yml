global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: ad-serving
    metrics_path: /metrics
    static_configs:
      - targets: ["ad-serving:8001"]

  - job_name: brand-api
    metrics_path: /metrics
    static_configs:
      - targets: ["brand-api:8000"]
